<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ code }} | MovieFlix</title>

    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="login-page">

<div class="login-container">

    <div class="login-card" style="text-align:center;">

        <div class="error-code">{{ code }}</div>

        <div class="login-logo">🎬 <span>Movie</span>Flix</div>

        <p class="login-text" style="margin-top:20px;">{{ message }}</p>

        <a href="{{ url_for('home') }}"
           class="login-button"
           style="display:block; text-decoration:none; text-align:center;">
            ← Back to Home
        </a>

        <div class="login-footer">
            <p>🎬 MovieFlix</p>
            <small>© 2026 College Project</small>
        </div>

    </div>

</div>

</body>

</html>
