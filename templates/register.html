<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | MovieFlix</title>

    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <div class="login-logo">🎬 <span>Movie</span>Flix</div>

        <p class="login-subtitle">AI Powered Movie Recommendation System</p>

        <h1>Create Account</h1>

        <p class="login-text">Register to start discovering movies</p>

        {% if error %}
            <div class="login-error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('register') }}" method="POST">

            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Create a username (3-20 characters)"
                   value="{{ username if username else '' }}"
                   autocomplete="username"
                   minlength="3"
                   maxlength="20"
                   autofocus
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create a password (at least 4 characters)"
                   autocomplete="new-password"
                   minlength="4"
                   required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   placeholder="Re-enter your password"
                   autocomplete="new-password"
                   minlength="4"
                   required>

            <button type="submit" class="login-button">Create Account →</button>

        </form>

        <div class="register-link">
            <span>Already have an account?</span>
            <a href="{{ url_for('login') }}">Login</a>
        </div>

        <div class="login-footer">
            <p>🎬 MovieFlix</p>
            <small>AI Movie Recommendation System</small><br>
            <small>© 2026 College Project</small>
        </div>

    </div>

</div>

</body>

</html>
